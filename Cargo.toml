[package]
name = "caldav-cli"
version = "0.1.0"
edition = "2024"
description = "CLI and MCP server for CalDAV calendars (iCloud by default)"
repository = "https://github.com/radiosilence/caldav-cli"
license = "MIT"
keywords = ["cli", "calendar", "caldav", "icalendar", "mcp"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
dirs = "6.0.0"
async-graphql = "7"
reqwest = { version = "0.13.1", default-features = false, features = [
  "json",
  "rustls"
] }
rmcp = { version = "1", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server"
] }
axum = "0.8"
http = "1"
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
roxmltree = "0.21.1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
